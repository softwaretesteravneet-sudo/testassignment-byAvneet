[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -ra
    -n 4
    --strict-markers
    --tb=short
    --browser-channel chrome
    --screenshot=only-on-failure
    --video=off
    --tracing=off
    --self-contained-html
    --log-cli-level=INFO
log_cli = true
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: critical happy-path coverage
    login: standard username/password login
    registration: customer registration and field validation
    sso: SSO via Auth0
filterwarnings =
    ignore::DeprecationWarning
